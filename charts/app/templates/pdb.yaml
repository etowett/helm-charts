{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
    # Celery pods share name/instance with the web pods. NotIn also matches pods
    # with no `component` label, so web pods are covered with or without one.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [celery-worker, celery-beat, celery-flower]
{{- end }}
