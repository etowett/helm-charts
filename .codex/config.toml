# Codex CLI — project-scoped configuration for etowett/helm-charts.
#
# This file MIRRORS the canonical Claude Code setup. `make doctor` fails the
# build when it drifts:
#
#   .claude/settings.json  hooks        -> [hooks] below
#   .claude/settings.json  permissions  -> .codex/rules/allowlist.rules
#   .claude/agents/*.md                 -> .codex/agents/*.toml
#   .claude/skills/                     -> .agents/skills symlink (automatic)
#
# Project-scoped config only loads once you trust the project — run `codex` in
# the repo and accept the trust prompt. `codex doctor` shows the resolved config.
# Docs: https://learn.chatgpt.com/docs/config-file/config-reference

# Codex may edit the workspace without prompting; anything not allowed in
# rules/allowlist.rules asks first.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
# `helm repo add`, kubeconform schema fetches and `make install-kubeconform`
# all need the network.
network_access = true
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
writable_roots = []

# --- Hooks — mirrors .claude/settings.json "hooks" ---------------------------
# The scripts are NOT duplicated: these point straight at .claude/hooks/*.sh,
# which read their payload from stdin and resolve the repo root under either
# client. The `bash -c "$(git rev-parse --show-toplevel)/..."` wrapper keeps the
# paths repo-relative — an absolute path here would break for every other
# contributor and in every git worktree. `make doctor` fails on absolute paths.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "bash -c 'exec \"$(git rev-parse --show-toplevel)/.claude/hooks/session-start.sh\"'"
timeout = 15

[[hooks.PreToolUse]]
matcher = "Bash"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash -c 'exec \"$(git rev-parse --show-toplevel)/.claude/hooks/guard-main-branch.sh\"'"
timeout = 10
[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash -c 'exec \"$(git rev-parse --show-toplevel)/.claude/hooks/guard-chart-contract.sh\"'"
timeout = 15

[[hooks.PostToolUse]]
matcher = "Edit|Write|MultiEdit"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash -c 'exec \"$(git rev-parse --show-toplevel)/.claude/hooks/ensure-newline.sh\"'"
timeout = 10

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "bash -c 'exec \"$(git rev-parse --show-toplevel)/.claude/hooks/lint-on-stop.sh\"'"
timeout = 30
