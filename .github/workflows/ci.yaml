---
name: Helm Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/ci.yaml'
      - '.github/ct.yaml'
      - 'Makefile'
      - 'scripts/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/ci.yaml'
      - '.github/ct.yaml'
      - 'Makefile'
      - 'scripts/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Tool versions — keep in lockstep with the Makefile. `make doctor` (run by the
# `meta` job below) fails the build when these and the Makefile disagree, so
# this comment is enforced rather than hoped for.
env:
  HELM_VERSION: v4.2.4
  PYTHON_VERSION: '3.13'
  KUBECONFORM_VERSION: v0.8.0
  KIND_VERSION: v0.33.0

jobs:
  # Lints the repository's own machinery — the workflows, the hooks, the drift
  # checker. Added after `actions/checkout@v3` sat broken in release.yml
  # ("too old to run on GitHub Actions") because nothing ever ran actionlint.
  meta:
    name: Lint tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        # shellcheck is preinstalled on ubuntu-latest; actionlint shells out to
        # it to lint every `run:` block as well as the workflow syntax.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: shellcheck hooks and scripts
        run: shellcheck -S warning .claude/hooks/*.sh scripts/*.sh

      - name: Config drift (make doctor)
        run: make doctor

      - name: Hook tests
        run: make test-hooks

  lint-chart:
    name: Lint and render
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.list-changed.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Detect changed charts
        id: list-changed
        run: |
          set -euo pipefail
          changed=$(ct list-changed --config .github/ct.yaml || true)
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts:"
            echo "${changed}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No charts changed."
          fi

      - name: Run chart-testing (lint)
        run: ct lint --config .github/ct.yaml

      - name: Render default values for every chart
        run: |
          set -euo pipefail
          for chart in charts/*/; do
            chart_name=$(basename "${chart}")
            echo "==> Rendering ${chart_name} (default values)"
            helm template "${chart_name}-ci" "${chart}" >/dev/null
          done

      - name: Render every example values file
        run: |
          set -euo pipefail
          shopt -s nullglob
          for chart in charts/*/; do
            chart_name=$(basename "${chart}")
            for example in "${chart}examples"/*.yaml; do
              echo "==> Rendering ${chart_name} with $(basename "${example}")"
              helm template "${chart_name}-ci" "${chart}" -f "${example}" >/dev/null
            done
          done

  validate-manifests:
    name: Validate (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs: lint-chart
    # Kubernetes releases upstream supports, plus one below the floor for
    # headroom. Keep in lockstep with KUBE_VERSIONS in the Makefile.
    strategy:
      fail-fast: false
      matrix:
        k8s:
          - '1.34.0'
          - '1.35.0'
          - '1.36.0'
          - '1.37.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate rendered manifests
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for chart in charts/*/; do
            chart_name=$(basename "${chart}")
            echo "==> Validating ${chart_name} (default values)"
            helm template "${chart_name}-ci" "${chart}" | \
              kubeconform -strict -ignore-missing-schemas \
                -kubernetes-version "${K8S_VERSION}" \
                -summary -output text

            for example in "${chart}examples"/*.yaml; do
              echo "==> Validating ${chart_name} with $(basename "${example}")"
              helm template "${chart_name}-ci" "${chart}" -f "${example}" | \
                kubeconform -strict -ignore-missing-schemas \
                  -kubernetes-version "${K8S_VERSION}" \
                  -summary -output text
            done
          done

  install-chart:
    name: Install (k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    needs:
      - lint-chart
      - validate-manifests
    if: needs.lint-chart.outputs.changed == 'true'
    # Real-cluster install tests. Node images are digest-pinned to the set built
    # for kind v0.33.0 — kind only ships specific patch tags, and the digest is
    # the only thing that guarantees an image built for this kind release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - k8s: '1.35'
            node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          - k8s: '1.36'
            node_image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - k8s: '1.37'
            node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Create kind cluster (${{ matrix.k8s }})
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ matrix.node_image }}
          cluster_name: chart-testing
          wait: 120s

      # --upgrade additionally installs the chart's PREVIOUS released version and
      # upgrades to this one, so a values or template change that breaks existing
      # releases fails here rather than in someone's cluster. It needs the
      # version-increment check, which .github/ct.yaml enables.
      - name: Run chart-testing (install and upgrade)
        run: ct install --config .github/ct.yaml --upgrade
